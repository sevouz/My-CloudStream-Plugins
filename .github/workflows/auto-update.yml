          print("  DonationBottomSheet patched")
          PYEOF
            fi
            
            # Patch DonationDialogFragment
            DDF="$SMALI_DIR/com/phisher98/donation/DonationDialogFragment.smali"
            if [ -f "$DDF" ]; then
