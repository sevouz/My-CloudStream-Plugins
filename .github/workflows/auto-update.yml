      - name: Update plugins.json with new versions, sizes and hashes
        if: steps.fetch_versions.outputs.needs_update == 'true'
        run: |
          python3 - <<'PYEOF'
          import json, hashlib, os
          
          plugin_dir = "."
          plugins_file = "plugins.json"
          
          with open(plugins_file) as f:
              plugins = json.load(f)
          
          # Load upstream files
          upstream_file = "/tmp/upstream_plugins.json"
          with open(upstream_file) as f:
              upstream = json.load(f)
          
          phisher_file = "/tmp/phisher_plugins.json"
          with open(phisher_file) as f:
              phisher = json.load(f)
          
          # Build upstream version lookup
          upstream_map = {p["internalName"]: p for p in upstream}
          phisher_map = {p["internalName"]: p for p in phisher}
          
          cnc_plugins = ["CastleTvProvider", "CNC Verse", "CNC Verse Mobile", "MovieBoxProvider", "MovieBoxProviderIN"]
          phisher_plugins = ["AniKoto", "HiAnime", "StreamPlay", "Reanime", "MovieBoxProviderPH"]
          
          for plugin in plugins:
              name = plugin["internalName"]
              
              cs3_name = name + ".cs3"
              cs3_path = os.path.join(plugin_dir, cs3_name)
              
              if not os.path.exists(cs3_path):
                  continue
              
              # Recalculate hash and size from the file (patched for CNC, unpatched for phisher)
              with open(cs3_path, "rb") as f:
                  data = f.read()
              
              sha256 = hashlib.sha256(data).hexdigest()
              size = len(data)
              
              # Update version from appropriate upstream
              if name in cnc_plugins and name in upstream_map:
                  plugin["version"] = upstream_map[name]["version"]
              elif name in phisher_plugins and name in phisher_map:
                  plugin["version"] = phisher_map[name]["version"]
              
              plugin["fileHash"] = f"sha256-{sha256}"
              plugin["fileSize"] = size
              
              print(f"Updated {name}: version={plugin['version']}, size={size}, hash=sha256-{sha256[:16]}...")
          
          with open(plugins_file, "w") as f:
              json.dump(plugins, f, indent=4)
          
          print("plugins.json updated")
          PYEOF

      - name: Commit and push updated plugins
        if: steps.fetch_versions.outputs.needs_update == 'true'
        continue-on-error: false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add *.cs3 plugins.json
          
          # Build commit message listing what changed
          MSG="Auto-update: patch & sync plugins"$'\n'$'\n'
          
          CASTLE_VER="${{ steps.fetch_versions.outputs.castle_ver }}"
          MY_CASTLE_VER="${{ steps.fetch_versions.outputs.my_castle_ver }}"
          [ "$CASTLE_VER" != "$MY_CASTLE_VER" ] && MSG+="- CastleTvProvider v$MY_CASTLE_VER → v$CASTLE_VER"$'\n'
          
          CNCVERSE_VER="${{ steps.fetch_versions.outputs.cncverse_ver }}"
          MY_CNCVERSE_VER="${{ steps.fetch_versions.outputs.my_cncverse_ver }}"
          [ "$CNCVERSE_VER" != "$MY_CNCVERSE_VER" ] && MSG+="- CNC Verse v$MY_CNCVERSE_VER → v$CNCVERSE_VER"$'\n'
          
          CNCVERSE_MOB_VER="${{ steps.fetch_versions.outputs.cncverse_mob_ver }}"
          MY_CNCVERSE_MOB_VER="${{ steps.fetch_versions.outputs.my_cncverse_mob_ver }}"
          [ "$CNCVERSE_MOB_VER" != "$MY_CNCVERSE_MOB_VER" ] && MSG+="- CNC Verse Mobile v$MY_CNCVERSE_MOB_VER → v$CNCVERSE_MOB_VER"$'\n'
          
          MOVIEBOX_VER="${{ steps.fetch_versions.outputs.moviebox_ver }}"
          MY_MOVIEBOX_VER="${{ steps.fetch_versions.outputs.my_moviebox_ver }}"
          [ "$MOVIEBOX_VER" != "$MY_MOVIEBOX_VER" ] && MSG+="- MovieBoxProvider v$MY_MOVIEBOX_VER → v$MOVIEBOX_VER"$'\n'
          
          MOVIEBOXIN_VER="${{ steps.fetch_versions.outputs.movieboxin_ver }}"
          MY_MOVIEBOXIN_VER="${{ steps.fetch_versions.outputs.my_movieboxin_ver }}"
          [ "$MOVIEBOXIN_VER" != "$MY_MOVIEBOXIN_VER" ] && MSG+="- MovieBoxProviderIN v$MY_MOVIEBOXIN_VER → v$MOVIEBOXIN_VER"$'\n'
          
          ANIKOTO_VER="${{ steps.fetch_versions.outputs.anikoto_ver }}"
          MY_ANIKOTO_VER="${{ steps.fetch_versions.outputs.my_anikoto_ver }}"
          [ "$ANIKOTO_VER" != "$MY_ANIKOTO_VER" ] && MSG+="- AniKoto v$MY_ANIKOTO_VER → v$ANIKOTO_VER"$'\n'
          
          HIANIME_VER="${{ steps.fetch_versions.outputs.hianime_ver }}"
          MY_HIANIME_VER="${{ steps.fetch_versions.outputs.my_hianime_ver }}"
          [ "$HIANIME_VER" != "$MY_HIANIME_VER" ] && MSG+="- HiAnime v$MY_HIANIME_VER → v$HIANIME_VER"$'\n'
          
          STREAMPLAY_VER="${{ steps.fetch_versions.outputs.streamplay_ver }}"
          MY_STREAMPLAY_VER="${{ steps.fetch_versions.outputs.my_streamplay_ver }}"
          [ "$STREAMPLAY_VER" != "$MY_STREAMPLAY_VER" ] && MSG+="- StreamPlay v$MY_STREAMPLAY_VER → v$STREAMPLAY_VER"$'\n'
          
          REANIME_VER="${{ steps.fetch_versions.outputs.reanime_ver }}"
          MY_REANIME_VER="${{ steps.fetch_versions.outputs.my_reanime_ver }}"
          [ "$REANIME_VER" != "$MY_REANIME_VER" ] && MSG+="- Reanime v$MY_REANIME_VER → v$REANIME_VER"$'\n'
          
          MOVIEBOXPH_VER="${{ steps.fetch_versions.outputs.movieboxph_ver }}"
          MY_MOVIEBOXPH_VER="${{ steps.fetch_versions.outputs.my_movieboxph_ver }}"
          [ "$MOVIEBOXPH_VER" != "$MY_MOVIEBOXPH_VER" ] && MSG+="- MovieBoxPH v$MY_MOVIEBOXPH_VER → v$MOVIEBOXPH_VER"$'\n'
          
          CINESTREAM_VER="${{ steps.fetch_versions.outputs.cinestream_ver }}"
          MY_CINESTREAM_VER="${{ steps.fetch_versions.outputs.my_cinestream_ver }}"
          [ "$CINESTREAM_VER" != "$MY_CINESTREAM_VER" ] && MSG+="- CineStream v$MY_CINESTREAM_VER → v$CINESTREAM_VER"$'\n'
          
          MSG+=$'\n'"Donation popups, ads and subscription dialogs stripped."
          
          # Retry push with exponential backoff
          push_with_retry() {
            local max_attempts=5
            local attempt=1
            local wait_time=5
            
            while [ $attempt -le $max_attempts ]; do
              echo "Push attempt $attempt..."
              if git push origin builds; then
                echo "✅ Push successful on attempt $attempt"
                return 0
              fi
              
              echo "❌ Push failed on attempt $attempt, retrying in ${wait_time}s..."
              sleep $wait_time
              
              # Pull latest changes before retry
              echo "Pulling latest changes..."
              git pull --rebase origin builds || true
              
              attempt=$((attempt + 1))
              wait_time=$((wait_time * 2))  # exponential backoff
            done
            
            echo "❌ Failed to push after $max_attempts attempts"
            return 1
          }
          
          git diff --cached --quiet || git commit -m "$MSG"
          push_with_retry
          echo "Pushed updated plugins to builds branch"

      - name: No updates needed
        if: steps.fetch_versions.outputs.needs_update != 'true'
        run: |
          echo "All plugins are already up to date. Nothing to do."
          echo "This workflow ran successfully at $(date -u +"%Y-%m-%d %H:%M:%S") UTC"
          echo "Upstream versions match local versions - no sync required"
      
      - name: Keep workflow active (prevent GitHub from disabling due to inactivity)
        if: always()
        run: |
          echo "✅ Workflow completed successfully"
          echo "This ensures GitHub doesn't disable the schedule due to apparent inactivity"
          echo "Next scheduled run: $(date -u -d '+1 hour' +"%Y-%m-%d %H:%M:%S") UTC"
