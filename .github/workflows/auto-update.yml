name: Auto Update & Patch Plugins

on:
  repository_dispatch:      # triggered by external cron service (cron-job.org)
    types: [update-plugins]
  workflow_dispatch:        # allows manual trigger from GitHub Actions tab
  push:
    branches:
      - master              # triggers on any push to master (keeps repo active)
    paths:
      - '.github/workflows/auto-update.yml'  # only when workflow itself changes

permissions:
  contents: write           # needed to commit to builds branch

jobs:
  update-plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 15     # prevent hanging (increased for reliability)
    
    # Force the job to always run
    # Triggered by: external cron (cron-job.org), manual, or workflow changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event_name == 'push'

    steps:
      - name: Checkout builds branch
        uses: actions/checkout@v5
        with:
          ref: builds
          fetch-depth: 0
        continue-on-error: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download baksmali & smali tools
        run: |
          mkdir -p tools
          curl -L "https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar" -o tools/baksmali.jar
          curl -L "https://bitbucket.org/JesusFreke/smali/downloads/smali-2.5.2.jar" -o tools/smali.jar
          echo "Tools downloaded"

      - name: Fetch upstream versions from CNCVerse and phisher98
        id: fetch_versions
        continue-on-error: false
        run: |
          # Retry logic for network requests
          retry_curl() {
            local url="$1"
            local output="$2"
            local max_attempts=3
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt: Fetching $url"
              if curl -f -s --retry 3 --retry-delay 2 "$url" -o "$output"; then
                echo "✅ Success on attempt $attempt"
                return 0
              fi
              echo "❌ Failed attempt $attempt"
              attempt=$((attempt + 1))
              sleep 5
            done
            
            echo "❌ All $max_attempts attempts failed for $url"
            return 1
          }
          
          echo "Fetching upstream plugins.json from NivinCNC..."
          retry_curl "https://raw.githubusercontent.com/NivinCNC/CNCVerse-Cloud-Stream-Extension/builds/plugins.json" "/tmp/upstream_plugins.json"
          
          echo "Fetching upstream plugins.json from phisher98..."
          retry_curl "https://raw.githubusercontent.com/phisher98/cloudstream-extensions-phisher/builds/plugins.json" "/tmp/phisher_plugins.json"
          
          echo "Fetching upstream plugins.json from CSX (Megix)..."
          retry_curl "https://raw.githubusercontent.com/SaurabhKaperwan/CSX/builds/plugins.json" "/tmp/csx_plugins.json"
          
          # Extract versions for CNCVerse plugins
          CASTLE_VER=$(jq -r '.[] | select(.internalName=="CastleTvProvider") | .version' /tmp/upstream_plugins.json)
          CNCVERSE_VER=$(jq -r '.[] | select(.internalName=="CNC Verse") | .version' /tmp/upstream_plugins.json)
          CNCVERSE_MOB_VER=$(jq -r '.[] | select(.internalName=="CNC Verse Mobile") | .version' /tmp/upstream_plugins.json)
          MOVIEBOX_VER=$(jq -r '.[] | select(.internalName=="MovieBoxProvider") | .version' /tmp/upstream_plugins.json)
          MOVIEBOXIN_VER=$(jq -r '.[] | select(.internalName=="MovieBoxProviderIN") | .version' /tmp/upstream_plugins.json)
          
          # Extract versions for phisher98 plugins
          ANIKOTO_VER=$(jq -r '.[] | select(.internalName=="AniKoto") | .version' /tmp/phisher_plugins.json)
          HIANIME_VER=$(jq -r '.[] | select(.internalName=="HiAnime") | .version' /tmp/phisher_plugins.json)
          STREAMPLAY_VER=$(jq -r '.[] | select(.internalName=="StreamPlay") | .version' /tmp/phisher_plugins.json)
          REANIME_VER=$(jq -r '.[] | select(.internalName=="Reanime") | .version' /tmp/phisher_plugins.json)
          MOVIEBOXPH_VER=$(jq -r '.[] | select(.internalName=="MovieBoxProvider") | .version' /tmp/phisher_plugins.json)
          
          # Extract versions for CSX (Megix) plugins
          CINESTREAM_VER=$(jq -r '.[] | select(.internalName=="CineStream") | .version' /tmp/csx_plugins.json)
          
          # Get current versions from our plugins.json
          MY_CASTLE_VER=$(jq -r '.[] | select(.internalName=="CastleTvProvider") | .version' plugins.json)
          MY_CNCVERSE_VER=$(jq -r '.[] | select(.internalName=="CNC Verse") | .version' plugins.json)
          MY_CNCVERSE_MOB_VER=$(jq -r '.[] | select(.internalName=="CNC Verse Mobile") | .version' plugins.json)
          MY_MOVIEBOX_VER=$(jq -r '.[] | select(.internalName=="MovieBoxProvider") | .version' plugins.json)
          MY_MOVIEBOXIN_VER=$(jq -r '.[] | select(.internalName=="MovieBoxProviderIN") | .version' plugins.json)
          MY_ANIKOTO_VER=$(jq -r '.[] | select(.internalName=="AniKoto") | .version' plugins.json)
          MY_HIANIME_VER=$(jq -r '.[] | select(.internalName=="HiAnime") | .version' plugins.json)
          MY_STREAMPLAY_VER=$(jq -r '.[] | select(.internalName=="StreamPlay") | .version' plugins.json)
          MY_REANIME_VER=$(jq -r '.[] | select(.internalName=="Reanime") | .version' plugins.json)
          MY_MOVIEBOXPH_VER=$(jq -r '.[] | select(.internalName=="MovieBoxProviderPH") | .version' plugins.json)
          MY_CINESTREAM_VER=$(jq -r '.[] | select(.internalName=="CineStream") | .version' plugins.json)
          
          echo "Upstream  | CastleTV=$CASTLE_VER | CNCVerse=$CNCVERSE_VER | CNCVerseMob=$CNCVERSE_MOB_VER | MovieBox=$MOVIEBOX_VER | MovieBoxIN=$MOVIEBOXIN_VER | AniKoto=$ANIKOTO_VER | HiAnime=$HIANIME_VER | StreamPlay=$STREAMPLAY_VER | Reanime=$REANIME_VER | MovieBoxPH=$MOVIEBOXPH_VER | CineStream=$CINESTREAM_VER"
          echo "Current   | CastleTV=$MY_CASTLE_VER | CNCVerse=$MY_CNCVERSE_VER | CNCVerseMob=$MY_CNCVERSE_MOB_VER | MovieBox=$MY_MOVIEBOX_VER | MovieBoxIN=$MY_MOVIEBOXIN_VER | AniKoto=$MY_ANIKOTO_VER | HiAnime=$MY_HIANIME_VER | StreamPlay=$MY_STREAMPLAY_VER | Reanime=$MY_REANIME_VER | MovieBoxPH=$MY_MOVIEBOXPH_VER | CineStream=$MY_CINESTREAM_VER"
          
          # Determine which need updating
          NEEDS_UPDATE=false
          [ "$CASTLE_VER" != "$MY_CASTLE_VER" ] && NEEDS_UPDATE=true && echo "CastleTvProvider needs update: $MY_CASTLE_VER -> $CASTLE_VER"
          [ "$CNCVERSE_VER" != "$MY_CNCVERSE_VER" ] && NEEDS_UPDATE=true && echo "CNC Verse needs update: $MY_CNCVERSE_VER -> $CNCVERSE_VER"
          [ "$CNCVERSE_MOB_VER" != "$MY_CNCVERSE_MOB_VER" ] && NEEDS_UPDATE=true && echo "CNC Verse Mobile needs update: $MY_CNCVERSE_MOB_VER -> $CNCVERSE_MOB_VER"
          [ "$MOVIEBOX_VER" != "$MY_MOVIEBOX_VER" ] && NEEDS_UPDATE=true && echo "MovieBoxProvider needs update: $MY_MOVIEBOX_VER -> $MOVIEBOX_VER"
          [ "$MOVIEBOXIN_VER" != "$MY_MOVIEBOXIN_VER" ] && NEEDS_UPDATE=true && echo "MovieBoxProviderIN needs update: $MY_MOVIEBOXIN_VER -> $MOVIEBOXIN_VER"
          [ "$ANIKOTO_VER" != "$MY_ANIKOTO_VER" ] && NEEDS_UPDATE=true && echo "AniKoto needs update: $MY_ANIKOTO_VER -> $ANIKOTO_VER"
          [ "$HIANIME_VER" != "$MY_HIANIME_VER" ] && NEEDS_UPDATE=true && echo "HiAnime needs update: $MY_HIANIME_VER -> $HIANIME_VER"
          [ "$STREAMPLAY_VER" != "$MY_STREAMPLAY_VER" ] && NEEDS_UPDATE=true && echo "StreamPlay needs update: $MY_STREAMPLAY_VER -> $STREAMPLAY_VER"
          [ "$REANIME_VER" != "$MY_REANIME_VER" ] && NEEDS_UPDATE=true && echo "Reanime needs update: $MY_REANIME_VER -> $REANIME_VER"
          [ "$MOVIEBOXPH_VER" != "$MY_MOVIEBOXPH_VER" ] && NEEDS_UPDATE=true && echo "MovieBoxPH needs update: $MY_MOVIEBOXPH_VER -> $MOVIEBOXPH_VER"
          [ "$CINESTREAM_VER" != "$MY_CINESTREAM_VER" ] && NEEDS_UPDATE=true && echo "CineStream needs update: $MY_CINESTREAM_VER -> $CINESTREAM_VER"
          
          echo "needs_update=$NEEDS_UPDATE" >> $GITHUB_OUTPUT
          echo "castle_ver=$CASTLE_VER" >> $GITHUB_OUTPUT
          echo "cncverse_ver=$CNCVERSE_VER" >> $GITHUB_OUTPUT
          echo "cncverse_mob_ver=$CNCVERSE_MOB_VER" >> $GITHUB_OUTPUT
          echo "moviebox_ver=$MOVIEBOX_VER" >> $GITHUB_OUTPUT
          echo "movieboxin_ver=$MOVIEBOXIN_VER" >> $GITHUB_OUTPUT
          echo "anikoto_ver=$ANIKOTO_VER" >> $GITHUB_OUTPUT
          echo "hianime_ver=$HIANIME_VER" >> $GITHUB_OUTPUT
          echo "streamplay_ver=$STREAMPLAY_VER" >> $GITHUB_OUTPUT
          echo "reanime_ver=$REANIME_VER" >> $GITHUB_OUTPUT
          echo "movieboxph_ver=$MOVIEBOXPH_VER" >> $GITHUB_OUTPUT
          echo "cinestream_ver=$CINESTREAM_VER" >> $GITHUB_OUTPUT
          echo "my_castle_ver=$MY_CASTLE_VER" >> $GITHUB_OUTPUT
          echo "my_cncverse_ver=$MY_CNCVERSE_VER" >> $GITHUB_OUTPUT
          echo "my_cncverse_mob_ver=$MY_CNCVERSE_MOB_VER" >> $GITHUB_OUTPUT
          echo "my_moviebox_ver=$MY_MOVIEBOX_VER" >> $GITHUB_OUTPUT
          echo "my_movieboxin_ver=$MY_MOVIEBOXIN_VER" >> $GITHUB_OUTPUT
          echo "my_anikoto_ver=$MY_ANIKOTO_VER" >> $GITHUB_OUTPUT
          echo "my_hianime_ver=$MY_HIANIME_VER" >> $GITHUB_OUTPUT
          echo "my_streamplay_ver=$MY_STREAMPLAY_VER" >> $GITHUB_OUTPUT
          echo "my_reanime_ver=$MY_REANIME_VER" >> $GITHUB_OUTPUT
          echo "my_movieboxph_ver=$MY_MOVIEBOXPH_VER" >> $GITHUB_OUTPUT
          echo "my_cinestream_ver=$MY_CINESTREAM_VER" >> $GITHUB_OUTPUT

      - name: Download updated plugins from upstream
        if: steps.fetch_versions.outputs.needs_update == 'true'
        continue-on-error: false
        run: |
          # Retry download function
          download_with_retry() {
            local url="$1"
            local output="$2"
            local max_attempts=3
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Downloading $output (attempt $attempt)..."
              if curl -f -L --retry 3 --retry-delay 2 "$url" -o "$output"; then
                echo "✅ Downloaded $output"
                return 0
              fi
              echo "❌ Failed attempt $attempt for $output"
              attempt=$((attempt + 1))
              sleep 3
            done
            
            echo "❌ Failed to download $output after $max_attempts attempts"
            return 1
          }
          
          BASE_URL="https://raw.githubusercontent.com/NivinCNC/CNCVerse-Cloud-Stream-Extension/builds"
          PHISHER_URL="https://raw.githubusercontent.com/phisher98/cloudstream-extensions-phisher/builds"
          
          CASTLE_VER="${{ steps.fetch_versions.outputs.castle_ver }}"
          MY_CASTLE_VER="${{ steps.fetch_versions.outputs.my_castle_ver }}"
          if [ "$CASTLE_VER" != "$MY_CASTLE_VER" ]; then
            download_with_retry "$BASE_URL/CastleTvProvider.cs3" "CastleTvProvider.cs3"
          fi
          
          CNCVERSE_VER="${{ steps.fetch_versions.outputs.cncverse_ver }}"
          MY_CNCVERSE_VER="${{ steps.fetch_versions.outputs.my_cncverse_ver }}"
          if [ "$CNCVERSE_VER" != "$MY_CNCVERSE_VER" ]; then
            download_with_retry "$BASE_URL/CNC%20Verse.cs3" "CNC Verse.cs3"
          fi
          
          CNCVERSE_MOB_VER="${{ steps.fetch_versions.outputs.cncverse_mob_ver }}"
          MY_CNCVERSE_MOB_VER="${{ steps.fetch_versions.outputs.my_cncverse_mob_ver }}"
          if [ "$CNCVERSE_MOB_VER" != "$MY_CNCVERSE_MOB_VER" ]; then
            download_with_retry "$BASE_URL/CNC%20Verse%20Mobile.cs3" "CNC Verse Mobile.cs3"
          fi
          
          MOVIEBOX_VER="${{ steps.fetch_versions.outputs.moviebox_ver }}"
          MY_MOVIEBOX_VER="${{ steps.fetch_versions.outputs.my_moviebox_ver }}"
          if [ "$MOVIEBOX_VER" != "$MY_MOVIEBOX_VER" ]; then
            download_with_retry "$BASE_URL/MovieBoxProvider.cs3" "MovieBoxProvider.cs3"
          fi
          
          MOVIEBOXIN_VER="${{ steps.fetch_versions.outputs.movieboxin_ver }}"
          MY_MOVIEBOXIN_VER="${{ steps.fetch_versions.outputs.my_movieboxin_ver }}"
          if [ "$MOVIEBOXIN_VER" != "$MY_MOVIEBOXIN_VER" ]; then
            download_with_retry "$BASE_URL/MovieBoxProviderIN.cs3" "MovieBoxProviderIN.cs3"
          fi
          
          ANIKOTO_VER="${{ steps.fetch_versions.outputs.anikoto_ver }}"
          MY_ANIKOTO_VER="${{ steps.fetch_versions.outputs.my_anikoto_ver }}"
          if [ "$ANIKOTO_VER" != "$MY_ANIKOTO_VER" ]; then
            download_with_retry "$PHISHER_URL/AniKoto.cs3" "AniKoto.cs3"
          fi
          
          HIANIME_VER="${{ steps.fetch_versions.outputs.hianime_ver }}"
          MY_HIANIME_VER="${{ steps.fetch_versions.outputs.my_hianime_ver }}"
          if [ "$HIANIME_VER" != "$MY_HIANIME_VER" ]; then
            download_with_retry "$PHISHER_URL/HiAnime.cs3" "HiAnime.cs3"
          fi
          
          STREAMPLAY_VER="${{ steps.fetch_versions.outputs.streamplay_ver }}"
          MY_STREAMPLAY_VER="${{ steps.fetch_versions.outputs.my_streamplay_ver }}"
          if [ "$STREAMPLAY_VER" != "$MY_STREAMPLAY_VER" ]; then
            download_with_retry "$PHISHER_URL/StreamPlay.cs3" "StreamPlay.cs3"
          fi
          
          REANIME_VER="${{ steps.fetch_versions.outputs.reanime_ver }}"
          MY_REANIME_VER="${{ steps.fetch_versions.outputs.my_reanime_ver }}"
          if [ "$REANIME_VER" != "$MY_REANIME_VER" ]; then
            download_with_retry "$PHISHER_URL/Reanime.cs3" "Reanime.cs3"
          fi
          
          MOVIEBOXPH_VER="${{ steps.fetch_versions.outputs.movieboxph_ver }}"
          MY_MOVIEBOXPH_VER="${{ steps.fetch_versions.outputs.my_movieboxph_ver }}"
          if [ "$MOVIEBOXPH_VER" != "$MY_MOVIEBOXPH_VER" ]; then
            download_with_retry "$PHISHER_URL/MovieBoxProvider.cs3" "MovieBoxProviderPH.cs3"
          fi
          
          CINESTREAM_VER="${{ steps.fetch_versions.outputs.cinestream_ver }}"
          MY_CINESTREAM_VER="${{ steps.fetch_versions.outputs.my_cinestream_ver }}"
          if [ "$CINESTREAM_VER" != "$MY_CINESTREAM_VER" ]; then
            download_with_retry "https://raw.githubusercontent.com/SaurabhKaperwan/CSX/builds/CineStream.cs3" "CineStream.cs3"
          fi

      - name: Patch all plugins (remove popups, ads, donation dialogs)
        if: steps.fetch_versions.outputs.needs_update == 'true'
        run: |
          patch_plugin() {
            local CS3="$1"
            echo "--- Patching: $CS3 ---"
            
            local WORK_DIR="/tmp/patch_$(basename "$CS3" .cs3)"
            local SMALI_DIR="$WORK_DIR/smali"
            local EXTRACT_DIR="$WORK_DIR/extracted"
            
            rm -rf "$WORK_DIR"
            mkdir -p "$EXTRACT_DIR" "$SMALI_DIR"
            
            # Extract cs3 (it's a zip)
            unzip -q "$CS3" -d "$EXTRACT_DIR"
            
            if [ ! -f "$EXTRACT_DIR/classes.dex" ]; then
              echo "  No classes.dex found, skipping"
              return
            fi
            
            # Disassemble dex to smali
            java -jar tools/baksmali.jar d "$EXTRACT_DIR/classes.dex" -o "$SMALI_DIR"
            
            # ── PATCH 1: DonationManager ──────────────────────────────────────
            # Kills checkAndShow() and showNow() — the two methods that trigger
            # the popup from within each provider's load() call
            DM="$SMALI_DIR/com/cncverse/donation/DonationManager.smali"
            if [ -f "$DM" ]; then
              python3 - "$DM" <<'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path, 'r') as f:
              content = f.read()
          
          # Methods to kill — replace entire body with return-void
          methods_to_kill = [
              (r'\.method public final checkAndShow\(Ljava/lang/String;\)V', 2),
              (r'\.method public final showNow\(Ljava/lang/String;\)V', 2),
              (r'\.method public final resetCooldown\(Landroid/content/Context;\)V', 2),
          ]
          
          for pattern, reg_count in methods_to_kill:
              content = re.sub(
                  r'(' + pattern + r').*?(\.end method)',
                  r'\1\n    .registers ' + str(reg_count) + r'\n    .param p1\n\n    return-void\n\2',
                  content,
                  flags=re.DOTALL
              )
          
          with open(path, 'w') as f:
              f.write(content)
          print("  DonationManager patched")
          PYEOF
            fi
            
            # ── PATCH 2: DonationDialogFragment ──────────────────────────────
            # Kills onCreateView (builds the dialog UI) and onStart (shows it)
            # Double-layer kill — even if DonationManager somehow triggers,
            # the dialog itself will not render
            DDF="$SMALI_DIR/com/cncverse/donation/DonationDialogFragment.smali"
            if [ -f "$DDF" ]; then
              python3 - "$DDF" <<'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path, 'r') as f:
              content = f.read()
          
          methods_to_kill = [
              (r'\.method public onCreateView\(Landroid/view/LayoutInflater;Landroid/view/ViewGroup;Landroid/os/Bundle;\)Landroid/view/View;', 4, 'object'),
              (r'\.method public onStart\(\)V', 1, 'void'),
              (r'\.method public onCreate\(Landroid/os/Bundle;\)V', 2, 'void'),
          ]
          
          for pattern, reg_count, ret_type in methods_to_kill:
              if ret_type == 'object':
                  replacement = r'\1\n    .registers ' + str(reg_count) + r'\n    .param p1\n    .param p2\n    .param p3\n\n    const/4 v0, 0x0\n    return-object v0\n\2'
              else:
                  params = '\n    .param p1' if reg_count > 1 else ''
                  replacement = r'\1\n    .registers ' + str(reg_count) + params + r'\n\n    return-void\n\2'
              
              content = re.sub(
                  r'(' + pattern + r').*?(\.end method)',
                  replacement,
                  content,
                  flags=re.DOTALL
              )
          
          with open(path, 'w') as f:
              f.write(content)
          print("  DonationDialogFragment patched")
          PYEOF
            fi
            
            # ── PATCH 3: SubscriptionManager (if present) ────────────────────
            # Kills any subscription gate that blocks content behind a paywall
            SM="$SMALI_DIR/com/cncverse/subscription/SubscriptionManager.smali"
            if [ -f "$SM" ]; then
              python3 - "$SM" <<'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path, 'r') as f:
              content = f.read()
          
          # Kill any method that checks subscription status
          # Replace isPremium / isSubscribed / checkSubscription to always return true
          # (so content is never gated)
          content = re.sub(
              r'(\.method public.*?(?:isPremium|isSubscribed|hasPremium|checkSubscription)\(\)Z)(.*?)(\.end method)',
              r'\1\n    .registers 1\n\n    const/4 v0, 0x1\n    return v0\n\3',
              content,
              flags=re.DOTALL
          )
          
          # Kill showSubscriptionDialog / showPaywall
          content = re.sub(
              r'(\.method public.*?(?:showSubscriptionDialog|showPaywall|showPremiumDialog)\(.*?\)V)(.*?)(\.end method)',
              r'\1\n    .registers 1\n\n    return-void\n\3',
              content,
              flags=re.DOTALL
          )
          
          with open(path, 'w') as f:
              f.write(content)
          print("  SubscriptionManager patched")
          PYEOF
            fi
            
            # ── PATCH 4: Any AdManager / AdProvider class ─────────────────────
            # Kill any ad loading or ad display methods generically
            for AD_FILE in $(find "$SMALI_DIR" -name "Ad*.smali" -o -name "*AdManager*.smali" -o -name "*AdHelper*.smali" 2>/dev/null); do
              python3 - "$AD_FILE" <<'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path, 'r') as f:
              content = f.read()
          
          # Kill any void method that contains "ad", "show", "load", "display"
          content = re.sub(
              r'(\.method public.*?(?:showAd|loadAd|displayAd|showInterstitial|showBanner)\(.*?\)V)(.*?)(\.end method)',
              r'\1\n    .registers 1\n\n    return-void\n\3',
              content,
              flags=re.DOTALL
          )
          
          with open(path, 'w') as f:
              f.write(content)
          print(f"  AdManager patched: {path}")
          PYEOF
            done
            
            # ── Recompile smali → dex ─────────────────────────────────────────
            java -jar tools/smali.jar assemble "$SMALI_DIR" -o "$EXTRACT_DIR/classes.dex"
            
            # ── Repack into cs3 ───────────────────────────────────────────────
            rm -f "$CS3"
            cd "$EXTRACT_DIR"
            zip -q -r "$OLDPWD/$CS3" .
            cd "$OLDPWD"
            
            echo "  Patched and repacked: $CS3"
          }
          
          # Run patch on every cs3 that was downloaded (check if newer than our copy)
          CASTLE_VER="${{ steps.fetch_versions.outputs.castle_ver }}"
          MY_CASTLE_VER="${{ steps.fetch_versions.outputs.my_castle_ver }}"
          if [ "$CASTLE_VER" != "$MY_CASTLE_VER" ]; then
            patch_plugin "CastleTvProvider.cs3"
          fi
          
          CNCVERSE_VER="${{ steps.fetch_versions.outputs.cncverse_ver }}"
          MY_CNCVERSE_VER="${{ steps.fetch_versions.outputs.my_cncverse_ver }}"
          if [ "$CNCVERSE_VER" != "$MY_CNCVERSE_VER" ]; then
            patch_plugin "CNC Verse.cs3"
          fi
          
          CNCVERSE_MOB_VER="${{ steps.fetch_versions.outputs.cncverse_mob_ver }}"
          MY_CNCVERSE_MOB_VER="${{ steps.fetch_versions.outputs.my_cncverse_mob_ver }}"
          if [ "$CNCVERSE_MOB_VER" != "$MY_CNCVERSE_MOB_VER" ]; then
            patch_plugin "CNC Verse Mobile.cs3"
          fi
          
          MOVIEBOX_VER="${{ steps.fetch_versions.outputs.moviebox_ver }}"
          MY_MOVIEBOX_VER="${{ steps.fetch_versions.outputs.my_moviebox_ver }}"
          if [ "$MOVIEBOX_VER" != "$MY_MOVIEBOX_VER" ]; then
            patch_plugin "MovieBoxProvider.cs3"
          fi
          
          MOVIEBOXIN_VER="${{ steps.fetch_versions.outputs.movieboxin_ver }}"
          MY_MOVIEBOXIN_VER="${{ steps.fetch_versions.outputs.my_movieboxin_ver }}"
          if [ "$MOVIEBOXIN_VER" != "$MY_MOVIEBOXIN_VER" ]; then
            patch_plugin "MovieBoxProviderIN.cs3"
          fi
          
          # ── Patch phisher98 plugins (different donation system) ───────────
          patch_phisher_plugin() {
            local CS3="$1"
            echo "--- Patching phisher98 plugin: $CS3 ---"
            
            local WORK_DIR="/tmp/patch_$(basename "$CS3" .cs3)"
            local SMALI_DIR="$WORK_DIR/smali"
            local EXTRACT_DIR="$WORK_DIR/extracted"
            
            rm -rf "$WORK_DIR"
            mkdir -p "$EXTRACT_DIR" "$SMALI_DIR"
            
            unzip -q "$CS3" -d "$EXTRACT_DIR"
            
            if [ ! -f "$EXTRACT_DIR/classes.dex" ]; then
              echo "  No classes.dex found, skipping"
              return
            fi
            
            java -jar tools/baksmali.jar d "$EXTRACT_DIR/classes.dex" -o "$SMALI_DIR"
            
            # Patch phisher98 DonationManager
            DM="$SMALI_DIR/com/phisher98/donation/DonationManager.smali"
            if [ -f "$DM" ]; then
              python3 - "$DM" <<'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path, 'r') as f:
              content = f.read()
          
          # Kill checkAndShow
          content = re.sub(
              r'(\.method public final checkAndShow\(Ljava/lang/String;\)V).*?(\.end method)',
              r'\1\n    .registers 2\n    .param p1\n\n    return-void\n\2',
              content,
              flags=re.DOTALL
          )
          
          # Kill showNow
          content = re.sub(
              r'(\.method public final showNow\(Landroidx/appcompat/app/AppCompatActivity;Ljava/lang/String;\)V).*?(\.end method)',
              r'\1\n    .registers 3\n    .param p1\n    .param p2\n\n    return-void\n\2',
              content,
              flags=re.DOTALL
          )
          
          with open(path, 'w') as f:
              f.write(content)
          print("  phisher98 DonationManager patched")
          PYEOF
            fi
            
            # Patch DonationBottomSheet
            DBS="$SMALI_DIR/com/phisher98/donation/DonationBottomSheet.smali"
            if [ -f "$DBS" ]; then
              python3 - "$DBS" <<'PYEOF'
          import re, sys
